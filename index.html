<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>María Fernanda &amp; Juan Esteban · Nuestra Boda</title>
<meta name="description" content="Con la bendición de Dios y de nuestros padres, tenemos el honor de invitarles a celebrar nuestra boda. Sábado 08 de marzo de 2026.">
<meta property="og:title" content="María Fernanda & Juan Esteban · Nuestra Boda">
<meta property="og:description" content="Sábado 08 de marzo de 2026 · Salón Jardines del Encanto, Santiago, Rep. Dom.">
<meta name="theme-color" content="#efe9df">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --sage:#8b9b7c;
    --sage-light:#a3b294;
    --sage-dark:#66765a;
    --green-ink:#3f5341;
    --text:#4a4a40;
    --gold:#c8a25a;
    --gold-light:#e7cf93;
    --gold-dark:#9a7633;
    --ivory:#fbf7ee;
    --bg:#ece6db;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.65), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(139,155,124,.18), transparent 60%),
      var(--bg);
    font-family:"Montserrat",system-ui,sans-serif;
    color:var(--text);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* textura de papel */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;z-index:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .42  0 0 0 0 .36  0 0 0 .18 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ================= ESCENA DEL SOBRE ================= */
  .scene{
    position:relative;z-index:1;
    min-height:100vh;min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:34px;padding:24px 16px;
    transition:opacity .9s ease, transform .9s ease;
  }
  .scene.gone{opacity:0;transform:scale(.96) translateY(30px);pointer-events:none}
  .scene .kicker{
    font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--sage-dark);
    text-align:center;line-height:2;
  }
  .scene .kicker .script{
    display:block;font-family:"Great Vibes",cursive;font-size:clamp(34px,9vw,44px);letter-spacing:0;
    text-transform:none;color:var(--green-ink);line-height:1.1;
  }

  .envelope{
    --w:min(88vw,440px);
    position:relative;width:var(--w);height:calc(var(--w)*.68);
    perspective:1400px;cursor:pointer;
    filter:drop-shadow(0 18px 28px rgba(70,64,48,.22)) drop-shadow(0 3px 6px rgba(70,64,48,.12));
    animation:float 5s ease-in-out infinite;
  }
  .envelope.open{animation:none;cursor:default}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

  .env-back{
    position:absolute;inset:0;border-radius:6px;z-index:1;
    background:linear-gradient(160deg,#7c8c6e,#6b7b5e);
  }
  .letter{
    position:absolute;left:5%;right:5%;bottom:5%;height:88%;z-index:3;
    background:var(--ivory);border-radius:3px;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding-top:9%;overflow:hidden;
    transition:transform 1.3s cubic-bezier(.55,0,.25,1) .55s;
  }
  .letter .mini-frame{position:absolute;inset:8px;border:1px solid var(--gold);opacity:.7}
  .letter .mini-frame::after{content:"";position:absolute;inset:4px;border:1px solid var(--gold);opacity:.6}
  .letter .mini-names{font-family:"Great Vibes",cursive;color:var(--green-ink);font-size:calc(var(--w)*.085);line-height:1}
  .letter .mini-date{font-size:10px;letter-spacing:.3em;margin-top:10px;color:var(--text)}
  .envelope.open .letter{transform:translateY(-62%)}

  .env-front{
    position:absolute;inset:0;z-index:4;border-radius:6px;overflow:hidden;pointer-events:none;
  }
  .env-front .side{position:absolute;inset:0}
  .env-front .left{background:linear-gradient(100deg,#93a384,#87977a);clip-path:polygon(0 0,52% 56%,0 100%)}
  .env-front .right{background:linear-gradient(260deg,#93a384,#87977a);clip-path:polygon(100% 0,48% 56%,100% 100%)}
  .env-front .bottom{background:linear-gradient(0deg,#8a9a7c,#9aaa8b);clip-path:polygon(0 100%,50% 50%,100% 100%)}

  .env-flap{
    position:absolute;left:0;right:0;top:0;height:62%;z-index:5;
    transform-origin:top center;transform-style:preserve-3d;
    transition:transform .8s cubic-bezier(.6,0,.3,1), z-index 0s linear .4s;
  }
  .env-flap .face{
    position:absolute;inset:0;backface-visibility:hidden;
    clip-path:polygon(0 0,100% 0,50% 100%);
    border-radius:6px 6px 0 0;
  }
  .env-flap .outer{background:linear-gradient(180deg,#9cab8d 0%,#8d9d7f 70%,#82927a 100%)}
  .env-flap .inner{background:linear-gradient(0deg,#b3c0a6,#a2b195);transform:rotateX(180deg)}
  .envelope.open .env-flap{transform:rotateX(180deg);z-index:2}

  .seal{
    position:absolute;left:50%;top:62%;z-index:6;
    width:calc(var(--w)*.2);height:calc(var(--w)*.2);
    transform:translate(-50%,-50%);border:0;background:none;cursor:pointer;
    transition:transform .5s ease, opacity .4s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .seal svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 4px rgba(80,60,20,.35))}
  .envelope:not(.open):hover .seal{transform:translate(-50%,-50%) scale(1.06)}
  .envelope.open .seal{opacity:0;transform:translate(-50%,-20%) scale(.6);pointer-events:none}
  .seal::after{
    content:"";position:absolute;inset:-10px;border-radius:50%;
    border:1px solid rgba(200,162,90,.7);animation:pulse 2.2s ease-out infinite;
  }
  .envelope.open .seal::after{display:none}
  @keyframes pulse{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.35);opacity:0}}

  .hint{
    font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--sage-dark);
    display:flex;align-items:center;gap:10px;transition:opacity .4s;
  }
  .hint::before,.hint::after{content:"";width:26px;height:1px;background:var(--gold)}
  .envelope.open ~ .hint{opacity:0}

  /* ================= INVITACIÓN ================= */
  .invite-wrap{
    position:relative;z-index:1;
    display:none;justify-content:center;align-items:flex-start;
    padding:28px 16px 48px;min-height:100vh;
  }
  .invite-wrap.show{display:flex}
  .card{
    position:relative;width:min(100%,470px);
    background:var(--ivory);
    background-image:radial-gradient(ellipse at 30% 20%,#fffdf8,transparent 70%);
    box-shadow:0 22px 50px rgba(70,64,48,.20),0 3px 8px rgba(70,64,48,.10);
    border-radius:2px;
    padding:clamp(70px,18vw,96px) clamp(30px,9vw,54px) clamp(70px,18vw,96px);
    text-align:center;
    opacity:0;transform:translateY(40px) scale(.97);
    transition:opacity 1.1s ease, transform 1.1s cubic-bezier(.2,.7,.2,1);
  }
  .invite-wrap.visible .card{opacity:1;transform:none}
  .card .frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .card .leaves{position:absolute;pointer-events:none;width:clamp(190px,56%,265px);height:auto}
  .card .leaves.tl{top:-6px;left:-8px}
  .card .leaves.br{bottom:-6px;right:-8px;transform:rotate(180deg)}

  .reveal{opacity:0;transform:translateY(12px);transition:opacity .9s ease, transform .9s ease}
  .invite-wrap.visible .reveal{opacity:1;transform:none}

  .caps{font-size:clamp(10px,2.7vw,12px);letter-spacing:.2em;text-transform:uppercase;line-height:1.9;color:var(--text)}
  .names{
    font-family:"Great Vibes",cursive;color:var(--green-ink);font-weight:400;
    font-size:clamp(38px,10.6vw,60px);line-height:1.05;margin:22px 0 26px;
  }
  .names .amp{display:flex;align-items:center;justify-content:center;gap:14px;font-size:.72em;margin:2px 0 6px}
  .names .amp::before,.names .amp::after{content:"";width:clamp(50px,18vw,90px);height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
  .names .amp::after{background:linear-gradient(270deg,transparent,var(--gold))}

  .date{display:flex;align-items:center;justify-content:center;margin:26px 0 22px;gap:0}
  .date .side{flex:1;font-size:clamp(11px,3vw,13px);letter-spacing:.2em;text-transform:uppercase}
  .date .center{padding:0 clamp(14px,4vw,22px);border-left:1px solid var(--gold);border-right:1px solid var(--gold)}
  .date .day{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:clamp(40px,11vw,52px);line-height:1;color:var(--text)}
  .date .year{font-size:clamp(11px,3vw,13px);letter-spacing:.2em;margin-top:6px}

  .divider{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px auto}
  .divider::before,.divider::after{content:"";width:clamp(60px,22vw,90px);height:1px;background:var(--gold);opacity:.8}
  .divider svg{width:12px;height:12px;fill:var(--gold)}

  .place{display:flex;gap:8px;justify-content:center;align-items:flex-start;margin-top:20px}
  .place svg{width:13px;height:16px;fill:var(--text);flex:none;margin-top:3px}
  .quote{font-family:"Great Vibes",cursive;font-size:clamp(24px,6.6vw,30px);color:var(--green-ink);line-height:1.3;margin-top:26px}

  .actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:30px}
  .btn{
    font-family:inherit;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;
    padding:11px 16px;border-radius:999px;border:1px solid var(--gold);color:var(--green-ink);
    background:transparent;transition:background .25s,color .25s;display:inline-flex;align-items:center;gap:8px;
  }
  .btn:hover{background:var(--gold);color:#fff}
  .btn.solid{background:var(--sage-dark);border-color:var(--sage-dark);color:#fff}
  .btn.solid:hover{background:var(--green-ink)}

  .replay{
    position:fixed;right:16px;bottom:16px;z-index:5;
    width:42px;height:42px;border-radius:50%;border:1px solid var(--gold);
    background:rgba(251,247,238,.9);color:var(--sage-dark);cursor:pointer;display:none;
    align-items:center;justify-content:center;
  }
  .replay.show{display:flex}
  .replay svg{width:18px;height:18px}

  /* destellos dorados */
  .sparkle{position:fixed;top:-20px;z-index:10;pointer-events:none;border-radius:50%;
    background:radial-gradient(circle,var(--gold-light),var(--gold));animation:fall linear forwards}
  .petal{position:fixed;top:-30px;z-index:10;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot));opacity:.2}}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.2s!important}
  }
</style>
</head>
<body>

<!-- ============ SOBRE ============ -->
<section class="scene" id="scene">
  <p class="kicker">Tienes una invitación especial<span class="script" id="kickerNames">María Fernanda &amp; Juan Esteban</span></p>

  <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Abrir la invitación">
    <div class="env-back"></div>
    <div class="letter">
      <div class="mini-frame"></div>
      <div class="mini-names" id="miniNames">M &amp; J</div>
      <div class="mini-date" id="miniDate">08 · 03 · 2026</div>
    </div>
    <div class="env-front"><div class="side left"></div><div class="side right"></div><div class="side bottom"></div></div>
    <div class="env-flap"><div class="face outer"></div><div class="face inner"></div></div>
    <button class="seal" id="seal" aria-label="Abrir sobre">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <radialGradient id="wax" cx="38%" cy="32%" r="75%">
            <stop offset="0" stop-color="#f3dea4"/>
            <stop offset=".45" stop-color="#d4ae62"/>
            <stop offset="1" stop-color="#946d2c"/>
          </radialGradient>
          <radialGradient id="waxIn" cx="60%" cy="65%" r="70%">
            <stop offset="0" stop-color="#e2c27c"/>
            <stop offset="1" stop-color="#b68d43"/>
          </radialGradient>
        </defs>
        <path fill="url(#wax)" d="M50 3c7 0 9 3 15 4s11 1 14 6 2 9 6 13 9 7 9 14-4 9-4 15 3 11-1 16-9 5-13 9-6 9-13 11-10-1-16 0-11 6-17 4-7-6-12-9-11-4-13-10 1-9-1-15-7-10-5-16 7-7 9-12 1-10 6-14 10-2 15-5 8-11 14-11z"/>
        <circle cx="50" cy="50" r="30" fill="url(#waxIn)"/>
        <circle cx="50" cy="50" r="30" fill="none" stroke="#9a7633" stroke-width="1.2" opacity=".6"/>
        <circle cx="50" cy="50" r="26" fill="none" stroke="#f5e3b0" stroke-width=".8" opacity=".5"/>
        <g stroke="#8a6526" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".85">
          <path d="M50 74 C50 60 50 45 50 28"/>
          <path d="M50 62 C44 58 40 56 37 50"/><path d="M50 62 C56 58 60 56 63 50"/>
          <path d="M50 50 C45 47 42 44 40 39"/><path d="M50 50 C55 47 58 44 60 39"/>
          <path d="M50 39 C47 36 45 34 44 30"/><path d="M50 39 C53 36 55 34 56 30"/>
        </g>
        <g fill="#8a6526" opacity=".8">
          <ellipse cx="36" cy="49" rx="3.2" ry="2.2" transform="rotate(-35 36 49)"/>
          <ellipse cx="64" cy="49" rx="3.2" ry="2.2" transform="rotate(35 64 49)"/>
          <ellipse cx="39.5" cy="38" rx="2.8" ry="2" transform="rotate(-45 39.5 38)"/>
          <ellipse cx="60.5" cy="38" rx="2.8" ry="2" transform="rotate(45 60.5 38)"/>
          <ellipse cx="50" cy="26" rx="2.4" ry="3.2"/>
        </g>
      </svg>
    </button>
  </div>

  <p class="hint">Toca el sello para abrir</p>
</section>

<!-- ============ INVITACIÓN ============ -->
<section class="invite-wrap" id="invite" aria-live="polite">
  <article class="card" id="card">
    <svg class="frame" id="frame" aria-hidden="true"></svg>
    <svg class="leaves tl" id="leavesTL" viewBox="0 0 240 300" aria-hidden="true"></svg>
    <svg class="leaves br" id="leavesBR" viewBox="0 0 240 300" aria-hidden="true"></svg>

    <p class="caps reveal" style="transition-delay:.3s" data-field="blessing"></p>

    <h1 class="names reveal" style="transition-delay:.55s">
      <span data-field="bride"></span>
      <span class="amp">&amp;</span>
      <span data-field="groom"></span>
    </h1>

    <p class="caps reveal" style="transition-delay:.8s" data-field="intro"></p>

    <div class="date reveal" style="transition-delay:1s">
      <div class="side" data-field="weekday"></div>
      <div class="center"><div class="day" data-field="day"></div><div class="year" data-field="year"></div></div>
      <div class="side" data-field="month"></div>
    </div>

    <div class="reveal" style="transition-delay:1.2s">
      <p class="caps" data-field="ceremony"></p>
      <div class="divider"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.3C.3 8.4 2.2 4 6.3 4c2.4 0 4 1.4 5.7 3.4C13.7 5.4 15.3 4 17.7 4 21.8 4 23.7 8.4 22 11.7 19.5 16.4 12 21 12 21z"/></svg></div>
      <p class="caps" data-field="reception"></p>
    </div>

    <div class="place reveal" style="transition-delay:1.4s">
      <svg viewBox="0 0 24 30"><path d="M12 0C5.4 0 0 5.3 0 11.9 0 20.8 12 30 12 30s12-9.2 12-18.1C24 5.3 18.6 0 12 0zm0 16.5a4.6 4.6 0 110-9.2 4.6 4.6 0 010 9.2z"/></svg>
      <p class="caps" data-field="venue"></p>
    </div>

    <p class="quote reveal" style="transition-delay:1.6s" data-field="quote"></p>

    <div class="actions reveal" style="transition-delay:1.8s">
      <a class="btn" id="mapBtn" target="_blank" rel="noopener">Ver ubicación</a>
      <a class="btn solid" id="rsvpBtn" target="_blank" rel="noopener">Confirmar asistencia</a>
    </div>
  </article>
</section>

<button class="replay" id="replay" aria-label="Volver a ver el sobre" title="Volver a ver el sobre">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
</button>

<script>
/* =========================================================
   ✏️  EDITA AQUÍ LOS DATOS DE TU BODA
   Usa "\n" para hacer un salto de línea.
   ========================================================= */
const BODA = {
  bride:     "María Fernanda",
  groom:     "Juan Esteban",
  initials:  "M & J",
  blessing:  "Con la bendición de Dios\ny de nuestros padres",
  intro:     "Tenemos el honor de invitarles\na celebrar nuestra boda",
  weekday:   "Sábado",
  day:       "08",
  month:     "Marzo",
  year:      "2026",
  shortDate: "08 · 03 · 2026",
  ceremony:  "Ceremonia: 5:30 P.M.",
  reception: "Recepción a seguir",
  venue:     "Salón Jardines del Encanto\nSantiago, Rep. Dom.",
  quote:     "Tu presencia hará\neste día aún más especial",
  // Enlace de Google Maps del lugar
  mapsUrl:   "https://maps.google.com/?q=Salón+Jardines+del+Encanto+Santiago+República+Dominicana",
  // Número de WhatsApp para confirmar (con código de país, sin + ni espacios). Ej: 18095551234
  whatsapp:  "",
  rsvpText:  "¡Hola! Confirmo mi asistencia a la boda de María Fernanda & Juan Esteban 💚"
};

/* ---------- Rellenar contenido ---------- */
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
document.querySelectorAll('[data-field]').forEach(el => {
  el.innerHTML = esc(BODA[el.dataset.field] || '').replace(/\n/g, '<br>');
});
document.getElementById('kickerNames').innerHTML = `${esc(BODA.bride)}<br>&amp; ${esc(BODA.groom)}`;
document.getElementById('miniNames').textContent = BODA.initials;
document.getElementById('miniDate').textContent = BODA.shortDate;
document.getElementById('mapBtn').href = BODA.mapsUrl;
const rsvp = document.getElementById('rsvpBtn');
rsvp.href = `https://wa.me/${BODA.whatsapp}?text=${encodeURIComponent(BODA.rsvpText)}`;

/* ---------- Ramas de eucalipto (acuarela en SVG) ---------- */
function rng(seed){ return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent){
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function defs(svg, id){
  const d = el('defs', {}, svg);
  const shades = [['#9fb497','#6f8a6a'],['#b5c6ab','#7f9878'],['#8aa184','#5d7758'],['#c2cfb9','#91a68a']];
  shades.forEach((s,i) => {
    const g = el('radialGradient', {id:`${id}g${i}`, cx:'35%', cy:'30%', r:'80%'}, d);
    el('stop', {offset:'0', 'stop-color':s[0]}, g);
    el('stop', {offset:'1', 'stop-color':s[1]}, g);
  });
  const f = el('filter', {id:`${id}wc`, x:'-20%', y:'-20%', width:'140%', height:'140%'}, d);
  el('feTurbulence', {type:'fractalNoise', baseFrequency:'.06', numOctaves:'2', seed:'3', result:'t'}, f);
  el('feDisplacementMap', {in:'SourceGraphic', in2:'t', scale:'2.2'}, f);
}
function quad(p0,p1,p2,t){
  const u = 1-t;
  return {
    x: u*u*p0.x + 2*u*t*p1.x + t*t*p2.x,
    y: u*u*p0.y + 2*u*t*p1.y + t*t*p2.y,
    a: Math.atan2(2*u*(p1.y-p0.y) + 2*t*(p2.y-p1.y), 2*u*(p1.x-p0.x) + 2*t*(p2.x-p1.x))
  };
}
function leaf(g, x, y, ang, size, id, r){
  const grp = el('g', {transform:`translate(${x} ${y}) rotate(${ang*180/Math.PI})`}, g);
  const s = size, w = s*1.05;
  // hoja redonda de eucalipto con pequeño pecíolo
  el('path', {
    d:`M0 0 L${s*.25} 0 C${s*.3} ${-w*.62} ${s*1.25} ${-w*.7} ${s*1.32} 0 C${s*1.25} ${w*.7} ${s*.3} ${w*.62} ${s*.25} 0 Z`,
    fill:`url(#${id}g${Math.floor(r()*4)})`, opacity:(.78 + r()*.2).toFixed(2)
  }, grp);
  el('path', {d:`M${s*.25} 0 Q${s*.8} ${(r()-.5)*s*.15} ${s*1.2} 0`, stroke:'#e9efe2', 'stroke-width':.6, fill:'none', opacity:.55}, grp);
}
function branch(g, p0, p1, p2, n, maxSize, id, r, side=true){
  el('path', {d:`M${p0.x} ${p0.y} Q${p1.x} ${p1.y} ${p2.x} ${p2.y}`, stroke:'#7d8f6f', 'stroke-width':1.3, fill:'none', 'stroke-linecap':'round'}, g);
  for (let i = 1; i <= n; i++){
    const t = i/(n+.6);
    const p = quad(p0,p1,p2,t);
    const size = maxSize * (1 - t*.55) * (.85 + r()*.3);
    const dir = i % 2 ? 1 : -1;
    leaf(g, p.x, p.y, p.a + dir*(.85 + r()*.5), size, id, r);
    if (side && r() > .55) leaf(g, p.x, p.y, p.a - dir*(.9 + r()*.4), size*.7, id, r);
  }
  const tip = quad(p0,p1,p2,1);
  leaf(g, tip.x, tip.y, tip.a, maxSize*.42, id, r);
}
function flower(g, x, y, s){
  const fg = el('g', {transform:`translate(${x} ${y})`}, g);
  for (let k = 0; k < 5; k++){
    const a = k*72*Math.PI/180;
    el('circle', {cx:Math.cos(a)*s, cy:Math.sin(a)*s, r:s*.85, fill:'#fffdf6', stroke:'#e4dcc8', 'stroke-width':.4}, fg);
  }
  el('circle', {r:s*.55, fill:'#d9bd78'}, fg);
}
function sprig(g, x, y, ang, len, r){
  const x2 = x + Math.cos(ang)*len, y2 = y + Math.sin(ang)*len;
  el('path', {d:`M${x} ${y} Q${(x+x2)/2 + 6} ${(y+y2)/2 - 4} ${x2} ${y2}`, stroke:'#b39a63', 'stroke-width':.7, fill:'none'}, g);
  for (let k = 0; k < 4; k++){
    const t = .4 + k*.2;
    el('circle', {cx:x + (x2-x)*t + (r()-.5)*6, cy:y + (y2-y)*t + (r()-.5)*6, r:1 + r()*1.2, fill:'#c8a25a', opacity:.85}, g);
  }
}
function drawCorner(svg, id, seed){
  const r = rng(seed);
  defs(svg, id);
  const g = el('g', {filter:`url(#${id}wc)`}, svg);
  // rama hacia la derecha (borde superior)
  branch(g, {x:22,y:58}, {x:110,y:20}, {x:228,y:16}, 8, 30, id, r);
  // rama hacia abajo (borde izquierdo)
  branch(g, {x:24,y:62}, {x:6,y:170}, {x:30,y:290}, 9, 31, id, r);
  // rama diagonal central
  branch(g, {x:26,y:60}, {x:70,y:80}, {x:100,y:126}, 4, 22, id, r, false);
  // ramitas doradas y flores
  sprig(svg, 40, 50, -0.3, 60, r);
  sprig(svg, 30, 90, 1.2, 55, r);
  sprig(svg, 70, 36, -0.15, 70, r);
  flower(svg, 64, 74, 3.2); flower(svg, 20, 140, 2.6); flower(svg, 150, 28, 2.4); flower(svg, 88, 102, 2.2);
  for (let k = 0; k < 18; k++){
    el('circle', {cx:20 + r()*160, cy:20 + r()*200, r:.6 + r()*1.3, fill:'#c8a25a', opacity:(.45 + r()*.5).toFixed(2)}, svg);
  }
}
drawCorner(document.getElementById('leavesTL'), 'a', 11);
drawCorner(document.getElementById('leavesBR'), 'b', 29);

/* ---------- Marco dorado con esquinas recortadas ---------- */
function drawFrame(){
  const card = document.getElementById('card'), svg = document.getElementById('frame');
  const W = card.clientWidth, H = card.clientHeight;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const m = W < 380 ? 14 : 20;
  const path = (i, r) => {
    const x0 = i, y0 = i, x1 = W - i, y1 = H - i;
    return `M${x0+r} ${y0} L${x1-r} ${y0} A${r} ${r} 0 0 0 ${x1} ${y0+r} L${x1} ${y1-r} A${r} ${r} 0 0 0 ${x1-r} ${y1} L${x0+r} ${y1} A${r} ${r} 0 0 0 ${x0} ${y1-r} L${x0} ${y0+r} A${r} ${r} 0 0 0 ${x0+r} ${y0} Z`;
  };
  svg.innerHTML =
    `<defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9b56d"/><stop offset=".5" stop-color="#b8904a"/><stop offset="1" stop-color="#d9b56d"/></linearGradient></defs>
     <path d="${path(m, 16)}" fill="none" stroke="url(#gold)" stroke-width="1.3"/>
     <path d="${path(m + 6, 12)}" fill="none" stroke="url(#gold)" stroke-width=".7" opacity=".75"/>`;
}
new ResizeObserver(drawFrame).observe(document.getElementById('card'));

/* ---------- Apertura del sobre ---------- */
const envelope = document.getElementById('envelope');
const scene = document.getElementById('scene');
const invite = document.getElementById('invite');
const replay = document.getElementById('replay');
let opened = false;

function openEnvelope(){
  if (opened) return;
  opened = true;
  envelope.classList.add('open');
  setTimeout(() => scene.classList.add('gone'), 2100);
  setTimeout(() => {
    scene.style.display = 'none';
    invite.classList.add('show');
    window.scrollTo(0, 0);
    requestAnimationFrame(() => requestAnimationFrame(() => invite.classList.add('visible')));
    drawFrame();
    celebrate();
    replay.classList.add('show');
  }, 2900);
}
envelope.addEventListener('click', openEnvelope);
envelope.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openEnvelope(); } });

replay.addEventListener('click', () => {
  invite.classList.remove('visible', 'show');
  replay.classList.remove('show');
  scene.style.display = '';
  envelope.classList.remove('open');
  requestAnimationFrame(() => scene.classList.remove('gone'));
  opened = false;
});

/* ---------- Destellos dorados y pétalos ---------- */
function celebrate(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (let i = 0; i < 38; i++){
    const isPetal = i % 3 === 0;
    const d = document.createElement('div');
    d.className = isPetal ? 'petal' : 'sparkle';
    d.style.left = Math.random()*100 + 'vw';
    d.style.setProperty('--dx', (Math.random()*120 - 60) + 'px');
    d.style.setProperty('--rot', (Math.random()*720 - 360) + 'deg');
    d.style.animationDuration = (3.5 + Math.random()*3) + 's';
    d.style.animationDelay = (Math.random()*1.5) + 's';
    if (isPetal){
      const s = 10 + Math.random()*8;
      d.innerHTML = `<svg width="${s}" height="${s*.8}" viewBox="0 0 20 16"><ellipse cx="10" cy="8" rx="9" ry="6.5" fill="${['#9fb497','#b5c6ab','#8aa184'][i%3]}" opacity=".85"/></svg>`;
    } else {
      const s = 3 + Math.random()*4;
      d.style.width = d.style.height = s + 'px';
    }
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 8000);
  }
}
</script>
